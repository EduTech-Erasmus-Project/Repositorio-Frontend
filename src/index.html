    <script type="text/javascript">
        function syncPrefsEditorOffset() {
            var root = document.documentElement;
            var prefsEditor = document.querySelector(".flc-prefsEditor-separatedPanel");

            if (!prefsEditor) {
                root.style.setProperty("--prefs-editor-offset", "0px");
                return;
            }

            var panel = prefsEditor.querySelector(".flc-slidingPanel-panel");
            var panelBar = prefsEditor.querySelector(".fl-panelBar");
            var editorRect = prefsEditor.getBoundingClientRect();
            var visibleBottom = editorRect.bottom;

            if (panel) {
                visibleBottom = Math.max(visibleBottom, panel.getBoundingClientRect().bottom);
            }

            if (panelBar) {
                visibleBottom = Math.max(visibleBottom, panelBar.getBoundingClientRect().bottom);
            }

            var nextOffset = Math.max(0, Math.ceil(visibleBottom));
            root.style.setProperty("--prefs-editor-offset", nextOffset + "px");
        }

        function bindPrefsEditorOffsetSync() {
            var prefsEditor = document.querySelector(".flc-prefsEditor-separatedPanel");

            if (!prefsEditor || prefsEditor.dataset.offsetSyncBound === "true") {
                syncPrefsEditorOffset();
                return;
            }

            prefsEditor.dataset.offsetSyncBound = "true";
            syncPrefsEditorOffset();

            var rafSync = function () {
                window.requestAnimationFrame(syncPrefsEditorOffset);
            };

            var resizeTarget = prefsEditor.querySelector(".flc-slidingPanel-panel");
            var panelBar = prefsEditor.querySelector(".fl-panelBar");
            var toggleButton = prefsEditor.querySelector(".flc-slidingPanel-toggleButton");

            if ("ResizeObserver" in window) {
                window.__prefsEditorResizeObserver = new ResizeObserver(rafSync);
                window.__prefsEditorResizeObserver.observe(prefsEditor);

                if (resizeTarget) {
                    window.__prefsEditorResizeObserver.observe(resizeTarget);
                }

                if (panelBar) {
                    window.__prefsEditorResizeObserver.observe(panelBar);
                }
            }

            if (toggleButton) {
                toggleButton.addEventListener("click", function () {
                    rafSync();
                    window.setTimeout(syncPrefsEditorOffset, 425);
                });
            }

            window.addEventListener("resize", rafSync, { passive: true });
            window.addEventListener("scroll", rafSync, { passive: true });
        }

        // Idioma elegido en el selector de la app (LanguageService); cambiarlo recarga la pagina.
        function resolvePrefsEditorLocale() {
            try {
                return JSON.parse(localStorage.getItem("lenguaje")) === "en" ? "en" : "es";
            } catch (e) {
                return "es";
            }
        }

        /*
         * Con lazyLoad, Infusion descarga ~25 plantillas/mensajes recien al primer clic,
         * lo que hace lenta la primera apertura. Se precargan en segundo plano cuando la
         * pagina queda libre; si el usuario abre el panel mientras la precarga esta en
         * curso, se espera a que termine en vez de dispararla otra vez.
         */
        var lazyShowPanel = fluid.prefs.separatedPanel.lazyLoad.showPanel;

        fluid.prefs.separatedPanel.lazyLoad.showPanel = function (separatedPanel, callback) {
            if (!separatedPanel.prefsEditor && separatedPanel.roaLazyLoadStarted) {
                separatedPanel.events.onReady.addListener(function () {
                    separatedPanel.events.onReady.removeListener("showPanelCallBack");
                    fluid.invokeLater(callback);
                }, "showPanelCallBack");
                return;
            }

            separatedPanel.roaLazyLoadStarted = true;
            lazyShowPanel(separatedPanel, callback);
        };

        function prefetchPrefsEditor(separatedPanel) {
            if (!separatedPanel || separatedPanel.prefsEditor || separatedPanel.roaLazyLoadStarted) {
                return;
            }

            separatedPanel.roaLazyLoadStarted = true;
            separatedPanel.events.onLazyLoad.fire();
        }

        function schedulePrefsEditorPrefetch(separatedPanel) {
            var start = function () {
                if ("requestIdleCallback" in window) {
                    window.requestIdleCallback(function () {
                        prefetchPrefsEditor(separatedPanel);
                    }, { timeout: 3000 });
                } else {
                    window.setTimeout(function () {
                        prefetchPrefsEditor(separatedPanel);
                    }, 1500);
                }
            };

            if (document.readyState === "complete") {
                start();
            } else {
                window.addEventListener("load", start, { once: true });
            }
        }

        $(document).ready(function () {
            var uiOptions = fluid.uiOptions(".flc-prefsEditor-separatedPanel", {
                auxiliarySchema: {
                    defaultLocale: resolvePrefsEditorLocale(),
                    terms: {
                        "templatePrefix": "assets/uiOptions/framework/preferences/html",
                        "messagePrefix": "assets/uiOptions/framework/preferences/messages"
                    },
                    "fluid.prefs.tableOfContents": {
                        enactor: {
                            "tocTemplate": "assets/uiOptions/components/tableOfContents/html/TableOfContents.html",
                            "tocMessage": "assets/uiOptions/framework/preferences/messages/tableOfContents-enactor.json",
                            "ignoreForToC": {
                                "overviewPanel": ".flc-overviewPanel"
                            }
                        }
                    }
                },
                prefsEditorLoader: {
                    lazyLoad: true
                }
            });

            schedulePrefsEditorPrefetch(uiOptions.prefsEditorLoader);
            bindPrefsEditorOffsetSync();
            window.setTimeout(bindPrefsEditorOffsetSync, 450);
        });
    </script>

    <!-- BEGIN markup for Preference Editor -->
    <div class="flc-prefsEditor-separatedPanel fl-prefsEditor-separatedPanel">
        <!-- Contenedor donde se renderiza el editor de preferencias -->
        <div class="flc-slidingPanel-panel"></div>

        <!-- Barra con los botones que muestran/ocultan el editor de preferencias -->
        <div class="fl-panelBar">

            <!-------------------------------Botones de Accesibilidad-------------------------------->
            <span class="fl-prefsEditor-buttons">

                    Reset</button>
                <button id="show-hide" class="flc-slidingPanel-toggleButton fl-prefsEditor-showHide">
                    Show/Hide</button>
            </span>
        </div>
    </div>
    <!-- END markup for Preference Editor -->
