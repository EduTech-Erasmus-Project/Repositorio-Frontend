<div class="main-content settings-page">
    <div class="settings-page__profile">
        <img
            class="settings-page__avatar"
            [src]="profileImage"
            alt=""
            loading="lazy">
        <div class="settings-page__identity">
            <p class="settings-page__name">{{ displayName }}</p>
            <p class="settings-page__subtitle">{{'profile.personalAccount'| translate}}.</p>
        </div>
    </div>
    <div class="settings-page__layout">
        <aside class="settings-page__sidebar side-menu">
            <div class="box sidebar">
                <app-side-menu></app-side-menu>
            </div>
        </aside>
        <section class="settings-page__content">
            <div class="box content">
                <router-outlet></router-outlet>
            </div>
        </section>
    </div>
</div>
