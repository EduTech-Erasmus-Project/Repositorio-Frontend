<section class="side-object">
  @if (objects?.length > 0) {
    <h2 class="side-object__title">
      {{ sectionTitleKey | translate }}
    </h2>
  }

  <div class="side-object__search">
    <p-iconfield iconPosition="left" class="side-object__search-field">
      <p-inputicon styleClass="pi pi-search"></p-inputicon>
      <input
        id="search"
        name="search"
        [(ngModel)]="title"
        type="text"
        pInputText
        [placeholder]="'input.search' | translate"
        aria-labelledby="searchbutton"
        (keyup.enter)="onSearch()"
        />
    </p-iconfield>

    <p-button
      id="searchbutton"
      (click)="onSearch()"
      [label]="'input.search' | translate"
      styleClass="side-object__search-button"
    ></p-button>
  </div>

  @if (objects?.length > 0) {
    <p-scrollPanel styleClass="side-object-scroll">
      <div class="side-object__list">
        @for (object of objects; track trackByObject($index, object)) {
          <button
            type="button"
            pRipple
            class="side-object-card"
            (click)="onClick(object.slug)"
            >
            <img
              loading="lazy"
              class="side-object-card__image"
              [src]="object.avatar"
              [alt]="object.general_title"
              />
            <div class="side-object-card__content">
              <h3 class="side-object-card__heading">{{ object.general_title }}</h3>
              <p class="side-object-card__author">
                {{ object.user_created.first_name }} {{ object.user_created.last_name }}
              </p>
              <span class="side-object-card__category">{{ object.knowledge_area?.name }}</span>
              <div class="side-object-card__rating">
                <p-rating
                  [ngModel]="object.rating || 0"
                  [readonly]="true"
                  [cancel]="false"
                  [stars]="5"
                ></p-rating>
              </div>
            </div>
          </button>
        }
      </div>
    </p-scrollPanel>
  }
</section>
