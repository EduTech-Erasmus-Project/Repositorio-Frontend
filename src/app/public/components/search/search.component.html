<div class="search">
  <h2>
    <label for="searchValue">{{ "home.tittle" | translate }}</label>
  </h2>

  <form class="search-bar" [formGroup]="formSearch" (ngSubmit)="onSearch()">
    <label for="dropdown" class="search-sr-only">{{ "input.searchType" | translate }}</label>
    <p-select
      inputId="dropdown"
      formControlName="dropdownValue"
      [options]="interestAreas"
      optionLabel="label"
      [placeholder]="'input.dropdown' | translate"
      [showClear]="true"
      appendTo="body"
      styleClass="search-select"
      panelStyleClass="search-select-panel"
    ></p-select>

    <div class="search-input-wrap">
      <input
        id="searchValue"
        name="searchValue"
        formControlName="searchValue"
        type="text"
        pInputText
        class="search-input"
        [placeholder]="'input.search' | translate"
        />
      <i class="pi pi-search" aria-hidden="true"></i>
    </div>

    <button
      pButton
      pRipple
      type="submit"
      [label]="'input.search' | translate"
      class="search-submit-button"
    ></button>
  </form>

  @if (showValidationError) {
    <div class="search-messages">
      <p-message severity="error" [text]="msjError.detail"></p-message>
    </div>
  }
</div>

<div class="search-info">
  <div class="search-info-card box item animate__animated animate__fadeIn">
    <i class="pi pi-user search-info-icon" aria-hidden="true"></i>
    <div class="info">
      <span class="search-info-count">{{ countStudents }}</span>
      <span>{{ "home.students" | translate }}</span>
    </div>
  </div>

  <div class="search-info-card box item animate__animated animate__fadeIn">
    <i class="pi pi-users search-info-icon" aria-hidden="true"></i>
    <div class="info">
      <span class="search-info-count">{{ countTeachers }}</span>
      <span>{{ "home.teachers" | translate }}</span>
    </div>
  </div>

  <div class="search-info-card box item animate__animated animate__fadeIn">
    <i class="pi pi-file search-info-icon" aria-hidden="true"></i>
    <div class="info">
      <span class="search-info-count">{{ countObjectLearning }}</span>
      <span>{{ "home.learning" | translate }}</span>
    </div>
  </div>
</div>
