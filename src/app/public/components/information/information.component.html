<div class="information-grid">
  <div class="information-card-column">
    <div class="box animate__animated animate__fadeIn">
      <figure>
        <img loading="lazy" src="assets/img/student.png" [alt]="'home.student.altImage' | translate">
      </figure>
      <h2>{{'home.student.title' | translate}}</h2>
      <p>{{'home.student.description' | translate}}</p>
      @if (!user) {
        <div class="buttons">
          <button
            (click)="onClickRegister('student')"
            pButton
            pRipple
            type="button"
            [label]="'object.registerByStudent' | translate"
            class="information-action-button"
          ></button>
        </div>
      }
    </div>
  </div>
  <div class="information-card-column">
    <div class="box animate__animated animate__fadeIn">
      <figure>
        <img loading="lazy" src="assets/img/teacherf.png" [alt]="'home.teacher.altImage' | translate">

      <h2>{{'home.teacher.title' | translate}}</h2>

        <div class="buttons">
          <button
            (click)="onClickRegister('teacher')"
            pButton
            pRipple
            type="button"
            [label]="'object.registerByTeacher' | translate"
            class="information-action-button"
          ></button>
        </div>
      }
    </div>
  </div>
  <div class="information-card-column">
    <div class="box animate__animated animate__fadeIn">
      <figure>
        <img loading="lazy" src="assets/img/expert.png" [alt]="'home.expert.altImage' | translate">
      </figure>
      <h2>{{'home.expert.title' | translate}}</h2>
      <p>{{'home.expert.description' | translate}}</p>
      @if (!user) {
        <div class="buttons">
          <button
            (click)="onClickRegister('expert')"
            pButton
            pRipple
            type="button"
            [label]="'object.registerByExpert' | translate"
            class="information-action-button"
          ></button>
        </div>
      }
    </div>
  </div>
</div>
