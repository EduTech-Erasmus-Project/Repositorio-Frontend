<div class="layout-topbar">
    <div class="layout-topbar-wrapper">
        <div class="layout-topbar-left">
            <button
                pRipple
                type="button"
                class="sidebar-menu-button topbar-button-reset"
                (click)="appMain.onMenuButtonClick($event)"
                aria-label="Mostrar u ocultar menú lateral"
            >
                <i class="pi pi-bars"></i>
            </button>

            <button
                pRipple
                type="button"
                class="topbar-menu-mobile-button topbar-button-reset"
                (click)="appMain.onTopbarMobileMenuButtonClick($event)"
                aria-label="Mostrar opciones del topbar"
            >
                <i class="pi pi-ellipsis-v"></i>
            </button>
        </div>

        <div class="layout-topbar-right fadeInDown" (click)="onTopbarRegionClick($event)">
            <ul class="layout-topbar-actions">
                <ng-container *ngTemplateOutlet="profilePanel"></ng-container>
            </ul>

            <ul class="profile-mobile-wrapper">
                <ng-container *ngTemplateOutlet="profilePanel"></ng-container>
            </ul>
        </div>
    </div>
</div>

<ng-template #profilePanel>
    <li
        #profileItem
        class="topbar-item profile-item admin-profile"
        [ngClass]="{
            'active-topmenuitem': appMain.activeTopbarItem === profileItem,
            'admin-profile-active': appMain.activeTopbarItem === profileItem
        }"
    >
        <button
            pRipple
            type="button"
            class="profile-toggle-button topbar-button-reset"
            (click)="appMain.onTopbarItemClick($event, profileItem)"
            aria-haspopup="menu"
            [attr.aria-expanded]="appMain.activeTopbarItem === profileItem"
        >
            <span class="profile-image-wrapper">
                <img [src]="userImage" [alt]="userFullName" />
            </span>
            <span class="admin-profile-info">
                <span class="admin-profile-name">{{ userFullName }}</span>
                <span class="admin-profile-role">{{ userPrimaryRole }}</span>
            </span>
            <i class="pi pi-angle-down admin-profile-chevron"></i>
        </button>

        <ul class="admin-profile-menu fadeInDown" (click)="onTopbarRegionClick($event)">
            <li class="admin-profile-menu-header">
                <div class="admin-profile-menu-summary">
                    <span class="profile-image-wrapper">
                        <img [src]="userImage" [alt]="userFullName" />
                    </span>
                    <div class="admin-profile-menu-user">
                        <strong>{{ userFullName }}</strong>
                        <span>{{ userEmail }}</span>
                    </div>
                </div>
            </li>

            <li>
                <a [routerLink]="profileRoute" class="admin-profile-menu-link">
                    <i class="pi pi-users icon icon-3"></i>
                    <span>Mi perfil</span>
                </a>
            </li>

            <li class="admin-profile-menu-footer">
                <button pRipple type="button" (click)="logOut()">
                    <i class="pi pi-sign-out"></i>
                    <span>Salir</span>
                </button>
            </li>
        </ul>
    </li>
</ng-template>
