<div class="accessdenied-page">
  <div class="accessdenied-shell">
    <section class="accessdenied-card" tabindex="0" aria-labelledby="accessdenied-title">
      <div class="accessdenied-card__visual" aria-hidden="true">
        <div class="accessdenied-illustration">
          <div class="accessdenied-illustration__halo"></div>
          <img
            class="accessdenied-illustration__image"
            loading="lazy"
            src="assets/layout/images/pages/asset-moon.svg"
            alt=""
          />
        </div>
        <div class="accessdenied-code-wrap">
          <span class="accessdenied-code">{{ "accessDenied.code" | translate }}</span>
        </div>
      </div>

      <div class="accessdenied-card__content">
        <p-tag [value]="'accessDenied.eyebrow' | translate"></p-tag>

        <h1 id="accessdenied-title">{{ "accessDenied.title" | translate }}</h1>
        <p class="accessdenied-description">{{ "accessDenied.description" | translate }}</p>

        <div class="accessdenied-hints">
          <div class="accessdenied-hint" tabindex="0">
            <i class="pi pi-shield"></i>
            <span>{{ "accessDenied.hintRole" | translate }}</span>
          </div>

          <div class="accessdenied-hint" tabindex="0">
            <i class="pi pi-envelope"></i>
            <span>{{ "accessDenied.hintContact" | translate }}</span>
          </div>
        </div>

        <div class="accessdenied-actions">
          <button
            pButton
            pRipple
            type="button"
            icon="pi pi-home"
            [routerLink]="homeRoute"
            [label]="'accessDenied.home' | translate"
          ></button>
        </div>
      </div>
    </section>
  </div>
</div>
