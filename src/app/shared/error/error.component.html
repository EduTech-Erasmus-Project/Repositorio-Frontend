<div class="error-page">
  <div class="error-shell">
    <section class="error-card" tabindex="0" aria-labelledby="error-title">
      <div class="error-card__visual" aria-hidden="true">
        <div class="error-illustration">
          <div class="error-illustration__halo"></div>
          <img
            class="error-illustration__image"
            src="assets/layout/images/pages/asset-moon.svg"
            alt=""
          />
        </div>
        <div class="error-code-wrap">
          <span class="error-code">{{ "errorPage.code" | translate }}</span>
        </div>
      </div>

      <div class="error-card__content">
        <p-tag [value]="'errorPage.eyebrow' | translate"></p-tag>

        <h1 id="error-title">{{ "errorPage.title" | translate }}</h1>
        <p class="error-description">{{ "errorPage.description" | translate }}</p>

        <div class="error-hints">
          <div class="error-hint" tabindex="0">
            <i class="pi pi-refresh"></i>
            <span>{{ "errorPage.hintRetry" | translate }}</span>
          </div>

          <div class="error-hint" tabindex="0">
            <i class="pi pi-home"></i>
            <span>{{ "errorPage.hintReturn" | translate }}</span>
          </div>
        </div>

        <div class="error-actions">
          <button
            pButton
            pRipple
            type="button"
            icon="pi pi-home"
            [routerLink]="['/']"
            label="{{ 'errorPage.home' | translate }}"
          ></button>

          <button
            pButton
            pRipple
            type="button"
            icon="pi pi-arrow-left"
            class="p-button-outlined"
            (click)="goBack()"
            label="{{ 'errorPage.back' | translate }}"
          ></button>
        </div>
      </div>
    </section>
  </div>
</div>
